name: Construire APK GABON 360 AI depuis le projet Android existant

on:
  workflow_dispatch:
  push:
    branches:
      - test-avatar-central

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet existant
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Préparer les ressources de l’icône officielle
        run: |
          set -euo pipefail
          test -s icons/gabon360-icon.jpg
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp icons/gabon360-icon.jpg android/app/src/main/res/drawable-nodpi/gabon360_icon.jpg
          test -s android/app/src/main/res/drawable-nodpi/gabon360_icon.jpg

      - name: Compiler le véritable projet Android du dépôt
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Vérifier et publier l’APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p resultat
          cp "$APK" resultat/GABON_360_AI_TEST.apk
          sha256sum resultat/GABON_360_AI_TEST.apk

      - name: Publier l’APK de test
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-test-${{ github.run_number }}
          name: GABON 360 AI — APK de test ${{ github.run_number }}
          body: |
            APK compilé depuis le projet Android existant dans android/.
            Aucun projet Android WebView temporaire n’est généré par ce workflow.
            Version de test : vérifier le fonctionnement sur appareil.
          prerelease: true
          files: resultat/GABON_360_AI_TEST.apk
          fail_on_unmatched_files: true
