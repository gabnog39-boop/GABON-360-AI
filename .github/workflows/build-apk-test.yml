name: Construire APK de secours GABON 360 AI

on:
  workflow_dispatch:
  push:
    branches:
      - test-avatar-central

permissions:
  contents: write

jobs:
  build-webview-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger la branche de test
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Vérifier la page principale
        run: test -s index.html
      - name: Créer un projet Android WebView autonome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android_project/app/src/main/assets/site
          mkdir -p android_project/app/src/main/java/gabon/gabon360
          mkdir -p android_project/app/src/main/res/values
          mkdir -p android_project/app/src/main/res/drawable
          cp index.html android_project/app/src/main/assets/site/index.html
          for f in gabon360-ia.js gabon360-modules-addon.js gabon360-centre.js gabon360-avatar-relay.js gabon360-navigation-offline.js gabon360-live-connectors.js; do
            if [ -f "$f" ]; then cp "$f" android_project/app/src/main/assets/site/; fi
          done
          if [ -d icons ]; then cp -R icons android_project/app/src/main/assets/site/; fi
          cat > android_project/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'GABON360AI'
          include ':app'
          EOF
          cat > android_project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > android_project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > android_project/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'gabon.gabon360'
              compileSdk 35
              defaultConfig {
                  applicationId 'gabon.gabon360'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '0.1-test'
              }
          }
          EOF
          cat > android_project/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application android:theme="@style/AppTheme" android:label="GABON 360 AI" android:icon="@drawable/ic_launcher" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > android_project/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#16734A</item><item name="android:windowLightStatusBar">false</item><item name="android:statusBarColor">#123B2B</item><item name="android:navigationBarColor">#123B2B</item></style></resources>
          EOF
          cat > android_project/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#009E60" android:pathData="M0,0h108v36h-108z"/>
              <path android:fillColor="#FCD116" android:pathData="M0,36h108v36h-108z"/>
              <path android:fillColor="#3A75C4" android:pathData="M0,72h108v36h-108z"/>
              <path android:fillColor="#123B2B" android:pathData="M15,15h78v78h-78z"/>
              <path android:fillColor="#009E60" android:pathData="M20,20h68v68h-68z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,29l6.5,15.5 16.5,1.3 -12.6,10.7 4,16.1 -14.4,-8.7 -14.4,8.7 4,-16.1 -12.6,-10.7 16.5,-1.3z"/>
          </vector>
          EOF
          cat > android_project/app/src/main/java/gabon/gabon360/MainActivity.java <<'EOF'
          package gabon.gabon360;
          import android.app.Activity;
          import android.os.Bundle;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Looper;
          import android.speech.tts.TextToSpeech;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.ViewGroup;
          import java.util.Locale;
          public class MainActivity extends Activity {
              private WebView web;
              private TextToSpeech tts;
              private volatile boolean ttsReady = false;
              private LocationManager locationManager;
              private Location lastGps;
              private final LocationListener gpsListener = new LocationListener() {
                  @Override public void onLocationChanged(Location location) {
                      lastGps = location;
                      if (web != null) {
                          String js = "window.dispatchEvent(new CustomEvent('g360:gps-fix',{detail:{lat:"+location.getLatitude()+",lon:"+location.getLongitude()+",accuracy:"+location.getAccuracy()+",speed:"+location.getSpeed()+",altitude:"+location.getAltitude()+",time:"+location.getTime()+"}}))";
                          runOnUiThread(() -> web.evaluateJavascript(js, null));
                      }
                  }
                  @Override public void onProviderEnabled(String provider) { gpsStatus(true, "GPS actif"); }
                  @Override public void onProviderDisabled(String provider) { gpsStatus(false, "GPS désactivé : active la localisation"); }
              };
              private void gpsStatus(boolean ok, String message) {
                  if (web != null) {
                      String safe = message.replace("'", "");
                      runOnUiThread(() -> web.evaluateJavascript("window.dispatchEvent(new CustomEvent('g360:gps-status',{detail:{ok:"+ok+",message:'"+safe+"'}}))", null));
                  }
              }
              private final class AndroidGPS {
                  @JavascriptInterface public void start() { runOnUiThread(() -> startGps()); }
                  @JavascriptInterface public void stop() { runOnUiThread(() -> stopGps()); }
                  @JavascriptInterface public boolean available() { return locationManager != null && locationManager.isProviderEnabled(LocationManager.GPS_PROVIDER); }
                  @JavascriptInterface public String last() { if(lastGps==null) return ""; return lastGps.getLatitude()+","+lastGps.getLongitude()+","+lastGps.getAccuracy()+","+lastGps.getTime(); }
              }
              private void startGps() {
                  locationManager = (LocationManager)getSystemService(LOCATION_SERVICE);
                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, 3601);
                      gpsStatus(false, "Autorisation GPS requise"); return;
                  }
                  try {
                      if (!locationManager.isProviderEnabled(LocationManager.GPS_PROVIDER)) { gpsStatus(false, "Active la localisation GPS du téléphone"); return; }
                      locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000L, 0.5f, gpsListener, Looper.getMainLooper());
                      Location last = locationManager.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                      if (last != null) gpsListener.onLocationChanged(last);
                      gpsStatus(true, "GPS satellite actif - aucune connexion mobile nécessaire");
                  } catch (SecurityException ex) { gpsStatus(false, "Autorisation GPS refusée"); }
              }
              private void stopGps() { if (locationManager != null) locationManager.removeUpdates(gpsListener); gpsStatus(false, "Suivi GPS arrêté"); }
              @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 3601) {
                      if (grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) startGps();
                      else gpsStatus(false, "Autorisation GPS refusée");
                  }
              }
              private final class AndroidTTS {
                  @JavascriptInterface public void speak(String text) {
                      runOnUiThread(() -> {
                          if (ttsReady && tts != null && text != null && !text.trim().isEmpty()) tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "gabon360-speech");
                          else if (web != null) web.evaluateJavascript("window.dispatchEvent(new CustomEvent('g360:tts-status',{detail:{ready:false}}))", null);
                      });
                  }
                  @JavascriptInterface public boolean isReady() { return ttsReady; }
              }
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) { int lang = tts.setLanguage(Locale.FRANCE); ttsReady = lang != TextToSpeech.LANG_MISSING_DATA && lang != TextToSpeech.LANG_NOT_SUPPORTED; }
                  });
                  web = new WebView(this); web.setLayoutParams(new ViewGroup.LayoutParams(-1, -1));
                  WebSettings settings = web.getSettings(); settings.setJavaScriptEnabled(true); settings.setDomStorageEnabled(true); settings.setDatabaseEnabled(true); settings.setAllowFileAccess(true); settings.setMediaPlaybackRequiresUserGesture(false);
                  web.addJavascriptInterface(new AndroidTTS(), "AndroidTTS"); web.addJavascriptInterface(new AndroidGPS(), "AndroidGPS"); web.setWebViewClient(new WebViewClient()); web.setWebChromeClient(new WebChromeClient());
                  setContentView(web); web.loadUrl("file:///android_asset/site/index.html");
              }
              @Override public void onDestroy() { if (tts != null) { tts.stop(); tts.shutdown(); } if (web != null) web.destroy(); super.onDestroy(); }
              @Override public void onBackPressed() { if (web != null && web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          EOF
      - name: Compiler APK de test
        run: |
          cd android_project
          gradle assembleDebug --no-daemon --stacktrace
      - name: Vérifier et publier le fichier APK
        run: |
          set -euo pipefail
          APK="android_project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p resultat
          cp "$APK" resultat/GABON_360_AI_TEST.apk
          sha256sum resultat/GABON_360_AI_TEST.apk
      - name: Publier APK de test comme version téléchargeable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-test-${{ github.run_number }}
          name: GABON 360 AI — APK de test ${{ github.run_number }}
          body: |
            APK de test construit automatiquement depuis la branche test-avatar-central.
            Cette version est destinée aux essais et ne modifie pas la branche principale.
          prerelease: true
          files: resultat/GABON_360_AI_TEST.apk
          fail_on_unmatched_files: true
