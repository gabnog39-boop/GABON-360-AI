name: Construire GABON 360 AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Préparer le projet Android
        shell: bash
        run: |
          set -e

          echo "Recherche du fichier ZIP..."

          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun fichier ZIP trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

          rm -rf android_project
          mkdir -p android_project

          unzip -o "$ZIP" -d android_project

          echo "Recherche du projet Android..."

          SETTINGS=$(find android_project -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle introuvable."
            find android_project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projet Android trouvé : $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Construire APK
        shell: bash
        run: |
          set -e

          echo "Projet : $project_dir"

          cd "$project_dir"

          echo "Version de Gradle :"
          gradle --version

          echo "Construction de l'APK..."

          gradle assembleDebug --no-daemon --stacktrace

      - name: Chercher APK
        shell: bash
        run: |
          set -e

          echo "Recherche de l'APK..."

          APK=$(find "$project_dir" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK trouvé."
            exit 1
          fi

          echo "APK trouvé : $APK"

          mkdir -p resultat

          cp "$APK" resultat/GABON_360_AI.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: GABON-360-AI-APK
          path: resultat/GABON_360_AI.apk
          if-no-files-found: error
