name: Construire GABON 360 AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Préparer le projet Android
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          mkdir -p android_project

          if [ -n "$ZIP" ]; then
            echo "ZIP trouvé : $ZIP"
            unzip -o "$ZIP" -d android_project
          else
            echo "Aucun ZIP trouvé."
            cp -r ./* android_project/ 2>/dev/null || true
          fi

          echo "Recherche du projet Android..."

          PROJECT_DIR=$(find android_project -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : projet Android introuvable."
            find android_project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Projet trouvé dans : $PROJECT_DIR"

          echo "Installation de Gradle..."
          sudo apt-get update
          sudo apt-get install -y gradle

          cd "$PROJECT_DIR"

          echo "Gradle version :"
          gradle --version

          echo "Construction du projet..."

          gradle assembleDebug --no-daemon --stacktrace

      - name: Chercher APK
        shell: bash
        run: |
          set -e

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK trouvé."
            exit 1
          fi

          echo "APK trouvé : $APK"

          mkdir -p sortie
          cp "$APK" sortie/GABON_360_AI.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: GABON-360-AI-APK
          path: sortie/GABON_360_AI.apk
          if-no-files-found: error
