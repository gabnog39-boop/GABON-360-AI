name: Construire GABON 360 AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Préparer le projet Android consolidé
        shell: bash
        run: |
          set -euo pipefail

          ZIP="GABON_360_AI_FINAL_CONSOLIDATED_V183_ICON.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERREUR : le ZIP canonique $ZIP est introuvable."
            echo "ZIP disponibles :"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf android_project
          mkdir -p android_project
          unzip -o "$ZIP" -d android_project

          echo "Recherche du projet Android dans le ZIP canonique..."
          SETTINGS=$(find android_project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle/settings.gradle.kts introuvable."
            find android_project -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Projet Android trouvé : $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Construire APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$project_dir"
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace

      - name: Vérifier et publier APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$project_dir" -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK trouvé après la compilation."
            exit 1
          fi

          mkdir -p resultat
          cp "$APK" resultat/GABON_360_AI.apk
          ls -lh resultat/GABON_360_AI.apk

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: GABON-360-AI-APK
          path: resultat/GABON_360_AI.apk
          if-no-files-found: error
