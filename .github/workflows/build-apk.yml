name: Construire GABON 360 AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Vérifier les modules serveur et injecteurs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile server/monitoring/domain_registry.py
          python -m py_compile server/monitoring/continuous_monitor.py
          python -m py_compile server/monitoring/central_ai_orchestrator.py
          python -m py_compile server/api/monitoring.py
          python -m py_compile server/api/monitoring_contract.py
          python -m py_compile server/api/central_assistant.py
          python -m py_compile server/integrations/satellite/change_detection.py
          python -m py_compile server/payments/access_ai.py
          python -m py_compile server/ai/specialized_registry.py
          python -m py_compile scripts/repair_html_script_boundaries.py
          for f in scripts/inject_national_center_ui.py scripts/inject_satellite_ui.py scripts/inject_control_modules.py scripts/inject_source_controls.py scripts/inject_terrain_navigation.py scripts/inject_terrain_navigation_v2.py scripts/inject_national_pages.py scripts/inject_page_completeness_v2.py scripts/inject_functional_page_actions_v1.py scripts/inject_avatar_central.py scripts/inject_avatar_life.py scripts/inject_avatar_living_v2.py scripts/inject_control_center_hardening.py scripts/inject_avatar_home_fix.py scripts/inject_scroll_fix.py scripts/inject_mobile_ui_polish.py scripts/inject_real_gabon_map.py scripts/inject_final_mobile_interaction.py scripts/inject_mobile_runtime_v2.py scripts/inject_native_android_bridge.py scripts/inject_native_interactions_v3.py scripts/inject_map_coordinates_v3.py scripts/preflight_apk_audit.py scripts/inject_final_native_io_repair.py scripts/inject_avatar_native_status_fix.py scripts/inject_native_bridge_runtime_fix_v2.py scripts/inject_avatar_controls_repair_v3.py scripts/inject_universal_module_pages_v1.py scripts/inject_ai_relay.py scripts/inject_final_duplicate_id_repair.py scripts/inject_final_runtime_duplicate_repair.py scripts/inject_runtime_integrity_audit_v1.py scripts/inject_terrain_navigation_garmin_class_v1.py scripts/inject_page_functionality_v2.py scripts/inject_page_functionality_bridge_v1.py scripts/inject_navigation_page_bridge_v1.py scripts/inject_cybersecurity_page_v1.py scripts/inject_cybersecurity_ai_avatar_v1.py scripts/inject_specialized_ai_architecture_v1.py; do python -m py_compile "$f"; done
      - name: Préparer le projet Android consolidé
        shell: bash
        run: |
          set -euo pipefail
          ZIP="GABON_360_AI_FINAL_CONSOLIDATED_V183_ICON.zip"
          test -f "$ZIP"
          rm -rf android_project
          mkdir -p android_project
          unzip -o "$ZIP" -d android_project
          SETTINGS=$(find android_project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Intégrer le Centre national de situation
        run: python3 scripts/inject_national_center_ui.py
      - name: Intégrer le panneau satellites publics Copernicus
        run: python3 scripts/inject_satellite_ui.py
      - name: Intégrer la carte réelle Gabon, routes, rivières et couche satellite
        run: python3 scripts/inject_real_gabon_map.py
      - name: Activer le clic carte pour coordonnées
        run: python3 scripts/inject_map_coordinates_v3.py
      - name: Intégrer les modules de contrôle complémentaires
        run: python3 scripts/inject_control_modules.py
      - name: Intégrer les contrôles des sources en attente
        run: python3 scripts/inject_source_controls.py
      - name: Intégrer la Navigation terrain de base
        run: python3 scripts/inject_terrain_navigation.py
      - name: Remplacer la navigation terrain par le module GNSS complet V2
        run: python3 scripts/inject_terrain_navigation_v2.py
      - name: Intégrer les pages nationales manuelles et la navigation IA
        run: python3 scripts/inject_national_pages.py
      - name: Ajouter la navigation terrain GPS outdoor complète
        run: python3 scripts/inject_terrain_navigation_garmin_class_v1.py
      - name: Vérifier la complétude de chaque page et de ses fonctions
        run: python3 scripts/inject_page_completeness_v2.py
      - name: Activer les actions fonctionnelles de chaque option
        run: python3 scripts/inject_functional_page_actions_v1.py
      - name: Intégrer l avatar IA centrale
        run: python3 scripts/inject_avatar_central.py
      - name: Activer la voix et l animation vivante de l IA
        run: python3 scripts/inject_avatar_life.py
      - name: Ajouter l animation vivante V2 de l avatar
        run: python3 scripts/inject_avatar_living_v2.py
      - name: Ajouter le moteur natif voix, micro et animation V3
        run: python3 scripts/inject_native_interactions_v3.py
      - name: Ajouter le pont Android natif pour TTS et reconnaissance vocale
        run: python3 scripts/inject_native_android_bridge.py
      - name: Corriger le pont Android natif et les boutons avatar après test réel
        run: python3 scripts/inject_native_bridge_runtime_fix_v2.py
      - name: Renforcer le Centre national et la traçabilité
        run: python3 scripts/inject_control_center_hardening.py
      - name: Corriger le défilement vertical
        run: python3 scripts/inject_scroll_fix.py
      - name: Appliquer la finition mobile et supprimer les chevauchements
        run: python3 scripts/inject_mobile_ui_polish.py
      - name: Forcer la présence de l avatar sur l accueil mobile
        run: python3 scripts/inject_avatar_home_fix.py
      - name: Appliquer la correction finale du défilement et de l avatar
        run: python3 scripts/inject_final_mobile_interaction.py
      - name: Appliquer le runtime mobile V2, micro et permissions GNSS
        run: python3 scripts/inject_mobile_runtime_v2.py
      - name: Réparer définitivement le branchement voix/micro natif final
        run: python3 scripts/inject_final_native_io_repair.py
      - name: Corriger l état vocal de l avatar après les injecteurs précédents
        run: python3 scripts/inject_avatar_native_status_fix.py
      - name: Réparer définitivement les boutons et le fallback vocal de l avatar
        run: python3 scripts/inject_avatar_controls_repair_v3.py
      - name: Créer une page dédiée pour chaque module et chaque fonction
        run: python3 scripts/inject_universal_module_pages_v1.py
      - name: Renforcer chaque page avec ses outils opérationnels
        run: python3 scripts/inject_page_functionality_v2.py
      - name: Relier chaque page aux outils renforcés
        run: python3 scripts/inject_page_functionality_bridge_v1.py
      - name: Ajouter la page dédiée de cybersécurité défensive
        run: python3 scripts/inject_cybersecurity_page_v1.py
      - name: Relier l IA cybersécurité à l avatar central et au relais IA
        run: python3 scripts/inject_cybersecurity_ai_avatar_v1.py
      - name: Fiabiliser l ouverture de la navigation terrain PRO
        run: python3 scripts/inject_navigation_page_bridge_v1.py
      - name: Relier toutes les IA et modules au relais central
        run: python3 scripts/inject_ai_relay.py
      - name: Activer l architecture IA spécialisée vers le relais et l avatar
        run: python3 scripts/inject_specialized_ai_architecture_v1.py
      - name: Nettoyer uniquement les vrais IDs HTML dupliqués
        run: python3 scripts/inject_final_duplicate_id_repair.py
      - name: Réparer les doublons JavaScript runtime après toutes les injections
        run: python3 scripts/inject_final_runtime_duplicate_repair.py
      - name: Audit d intégrité runtime final
        run: python3 scripts/inject_runtime_integrity_audit_v1.py
      - name: Réparer les frontières des scripts HTML consolidés
        run: python3 scripts/repair_html_script_boundaries.py
      - name: Audit préliminaire obligatoire du Centre
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/preflight_apk_audit.py android_project
      - name: Vérifier les fonctionnalités critiques du Centre
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          htmls=sorted(Path('android_project').rglob('index.html'), key=lambda p: len(p.parts))
          if not htmls: raise SystemExit('CRITICAL-AUDIT FAIL: index.html introuvable')
          html=htmls[0].read_text(encoding='utf-8', errors='ignore')
          required=['GABON360-SPECIALIZED-AI-ARCHITECTURE-V1','GABON360-UNIVERSAL-MODULE-PAGES-V1','G360-PAGE-FUNCTIONALITY-V2','GABON360-PAGE-FUNCTIONALITY-BRIDGE-V1','g360-universal-launch','G360AvatarSpeak','G360AvatarListen','G360AvatarStop','GABON360_SATELLITE_RESULTS','GABON360_SELECTED_COORDINATES','gabon360:coordinates-selected','gabon360:page-action']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('CRITICAL-AUDIT FAIL: '+', '.join(missing))
          print('CRITICAL-AUDIT: OK — pages, avatar, satellite and action relay present')
          PY
          python3 - <<'PY'
          from pathlib import Path
          bridges=list(Path('android_project').rglob('G360NativeBridge.java'))
          if not bridges: raise SystemExit('CRITICAL-AUDIT FAIL: G360NativeBridge.java absent')
          src=bridges[0].read_text(encoding='utf-8', errors='ignore')
          for item in ['speak(String text)','startListening()','stopListening()','stopSpeaking()']:
              if item not in src: raise SystemExit('CRITICAL-AUDIT FAIL: native method absent: '+item)
          print('CRITICAL-AUDIT: OK — native voice bridge complete')
          PY
      - name: Audit Java natif généré avant compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          bridges=list(Path('android_project').rglob('G360NativeBridge.java'))
          if not bridges: raise SystemExit('JAVA-AUDIT FAIL: bridge absent')
          src=bridges[0].read_text(encoding='utf-8', errors='ignore')
          if '}\\n    @JavascriptInterface' in src: raise SystemExit('JAVA-AUDIT FAIL: saut de ligne Java injecté comme texte')
          if len(re.findall(r'void\s+stopSpeaking\s*\(',src)) != 1: raise SystemExit('JAVA-AUDIT FAIL: stopSpeaking dupliqué ou absent')
          if len(re.findall(r'void\s+stopListening\s*\(',src)) != 1: raise SystemExit('JAVA-AUDIT FAIL: stopListening dupliqué ou absent')
          for method in ['speak(String text)','startListening()','stopListening()','stopSpeaking()']:
              if method not in src: raise SystemExit('JAVA-AUDIT FAIL: '+method)
          print('JAVA-AUDIT: OK — bridge natif propre')
          PY
      - name: Audit syntaxique JavaScript final
        shell: bash
        run: |
          set -euo pipefail
          node --version
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          htmls=sorted(Path('android_project').rglob('index.html'), key=lambda p: len(p.parts))
          if not htmls: raise SystemExit('JS-AUDIT FAIL: index.html introuvable')
          html=htmls[0].read_text(encoding='utf-8', errors='ignore')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S|re.I)
          checked=0
          for i, block in enumerate(blocks):
              p=Path(tempfile.gettempdir())/f'g360_script_{i}.js'; p.write_text(block,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'JS-AUDIT FAIL block={i}: {r.stderr}')
              checked += 1
          print('JS-AUDIT: OK', checked, 'JavaScript blocks checked')
          PY
      - name: Construire APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$project_dir"
          gradle assembleDebug --no-daemon --stacktrace
      - name: Vérifier et publier APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$project_dir" -type f -name "*.apk" -print -quit)
          test -n "$APK"
          mkdir -p resultat
          cp "$APK" resultat/GABON_360_AI.apk
          ls -lh resultat/GABON_360_AI.apk
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: GABON-360-AI-APK
          path: resultat/GABON_360_AI.apk
          if-no-files-found: error

# Build marker: centre national + pages fonctionnelles dédiées + actions + intégrité runtime + audit JS + relais IA + voix/micro natifs + avatar V3 + carte/coordonnées + GNSS V2 + traçabilité.
