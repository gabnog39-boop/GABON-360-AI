name: Tests Python — collaboration des 22 IA

on:
  push:
    branches:
      - test-avatar-central
    paths:
      - "server/ai/**"
      - "server/monitoring/central_ai_orchestrator.py"
      - "tests/**"
      - ".github/workflows/test-agent-collaboration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exécuter les tests de collaboration
        run: python -m unittest discover -s tests -v
