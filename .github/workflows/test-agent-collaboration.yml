name: Tests Python — collaboration des 22 IA

on:
  push:
    branches:
      - test-avatar-central
    paths:
      - "server/ai/**"
      - "server/monitoring/central_ai_orchestrator.py"
      - "tests/**"
      - "gabon360-ia.js"
      - "api/assistant.js"
      - "api/collaboration.js"
      - "tests/collaboration-api.test.js"
      - ".github/workflows/test-agent-collaboration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier la syntaxe du noyau JavaScript
        run: node --check gabon360-ia.js
      - name: Vérifier la syntaxe de l'API centrale
        run: node --check api/assistant.js
      - name: Vérifier la syntaxe de l'API de collaboration
        run: node --check api/collaboration.js
      - name: Tester l'API de collaboration
        run: node tests/collaboration-api.test.js
      - name: Exécuter les tests de collaboration
        run: python -m unittest discover -s tests -v
