name: Surveillance autonome du Gabon

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer dépendance HTTP
        run: python -m pip install requests

      - name: Vérifier et exécuter la surveillance
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile server/monitoring/continuous_monitor.py
          python -m py_compile server/integrations/satellite/central_ai.py
          python -m py_compile server/integrations/satellite/change_detection.py
          python -m py_compile server/api/monitoring.py
          python -m py_compile server/api/alerts.py
          python scripts/run_gabon_monitor.py
          echo "Surveillance autonome terminée."
