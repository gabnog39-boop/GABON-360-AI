name: GABON 360 AI - Surveillance automatique du Gabon

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install requests

      - name: Scan public satellite catalog
        run: python scripts/run_gabon_monitor.py

      - name: Upload monitoring result
        uses: actions/upload-artifact@v4
        with:
          name: gabon-360-monitoring-result
          path: monitoring_output.json
          retention-days: 7
